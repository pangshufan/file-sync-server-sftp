name: Build desktop applications
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Install build dependencies
        run: python -m pip install ".[build,dev,interop]"
      - name: Report filesystem metadata
        run: python tools/diagnose_filesystem.py
      - name: Run functional acceptance tests
        run: python -m pytest -q --junitxml=build/test-results/pytest.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ runner.os }}-${{ runner.arch }}
          path: build/test-results/pytest.xml
          if-no-files-found: warn
      - name: Check translations and documentation pairs
        run: python tools/check_translations.py
      - name: Build native GUI and CLI
        run: python tools/build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: simple-sync-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
